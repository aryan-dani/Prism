[project]
name = "prism"
version = "0.1.0"
description = "Prism - Kohler Unified Enterprise AI Agent (Track 3, Kohler-MITWPU AI Research Lab)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pypdf>=4.2",
    "markdown-it-py>=3.0",
    "tqdm>=4.66",
    "pydantic>=2.7",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "ollama>=0.3",
    "numpy>=1.26",
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "markdown2>=2.4",
    "xhtml2pdf>=0.2.16",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
